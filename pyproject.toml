[project]
name = "agentchord"
version = "0.1.0"
description = "This is a multi-agent framework that effectively orchestrates agent collaborations and optimizes the settings of the agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.7.0",
    "bitsandbytes>=0.46.0",
    "fuzzywuzzy>=0.18.0",
    "gitpython>=3.1.44",
    "litellm>=1.59.8",
    "matplotlib>=3.10.3",
    "networkx>=3.4.2",
    "numpy>=2.2.3",
    "protobuf>=6.31.0",
    "python-levenshtein>=0.26.1",
    "sacremoses>=0.1.1",
    "sentencepiece>=0.2.0",
    "torch>=2.7.0",
    "transformers>=4.52.3",
]

[project.scripts]
agentchord = "agentchord:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
